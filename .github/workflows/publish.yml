name: Versioned releases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  skill-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Run skill verify health check
        run: bash scripts/run-skill-verify.sh

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Compliance gate
        run: npm run compliance

  release:
    needs: [skill-health, compliance]
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    # v0.1.0 predates this reusable workflow. Pin the reviewed implementation.
    uses: mikkel3000/versionedcommits/.github/workflows/versionedcommits.yml@eb9ac58a58fb9ef7ed92802cbdcc244106e3e8b0
